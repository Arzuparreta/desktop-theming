name: AppImage
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (must match desktop_theming.__version__, e.g. 0.4.0)'
        required: true
        type: string

concurrency:
  group: appimage-${{ github.event_name == 'workflow_dispatch' && 'release' || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  appimage:
    runs-on: ubuntu-22.04
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate release source and version
        id: source
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          IS_RELEASE: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [[ "$IS_RELEASE" == true ]]; then
            [[ "$GITHUB_REF" == refs/heads/main ]] || { echo 'Release must run on main'; exit 1; }
            [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Use a stable X.Y.Z version'; exit 1; }
            [[ "$RELEASE_VERSION" == "$(python3 -c 'from desktop_theming import __version__; print(__version__)')" ]] || { echo 'Version does not match source'; exit 1; }
            [[ "$(git ls-remote origin refs/heads/main | cut -f1)" == "$(git rev-parse HEAD)" ]] || { echo 'main advanced; dispatch again'; exit 1; }
            [[ -z "$(git ls-remote origin "refs/tags/v$RELEASE_VERSION")" ]] || { echo 'Tag already exists; bump the source version'; exit 1; }
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare Qt runtime libraries on the build runner
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libegl1 libopengl0 libgl1-mesa-dri xvfb xauth \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxkbcommon-x11-0 \
            feh x11-utils
      - name: Prepare isolated build tools
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-build.txt ruff
      - name: Test GUI and engine offscreen
        run: |
          .venv/bin/python -m unittest discover -s tests -v
          .venv/bin/ruff check desktop_theming tests
          bash -n install.sh scripts/build-appimage.sh
      - name: Fetch pinned appimagetool
        run: |
          curl --fail --location --output "$RUNNER_TEMP/appimagetool" https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  $RUNNER_TEMP/appimagetool" | sha256sum --check
          chmod +x "$RUNNER_TEMP/appimagetool"
          curl --fail --location --output "$RUNNER_TEMP/appimage-runtime" https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-x86_64
          echo "617aa77314d57c8b8e4fae9c3f0b35af7b30d5529cb69e98f64f92510ed98a46  $RUNNER_TEMP/appimage-runtime" | sha256sum --check
      - name: Build AppImage
        run: APPIMAGETOOL="$RUNNER_TEMP/appimagetool" APPIMAGE_RUNTIME="$RUNNER_TEMP/appimage-runtime" scripts/build-appimage.sh
      - name: Check host graphics runtime compatibility
        run: |
          test ! -e dist/desktop-theming/_internal/libstdc++.so.6
          APPIMAGE_EXTRACT_AND_RUN=1 LIBGL_ALWAYS_SOFTWARE=1 QT_DEBUG_PLUGINS=1 \
            xvfb-run -a dist/DesktopTheming-x86_64.AppImage --smoke-test-x11 > "$RUNNER_TEMP/x11-smoke.log" 2>&1 \
            || { cat "$RUNNER_TEMP/x11-smoke.log"; exit 1; }
          grep '^PASS:' "$RUNNER_TEMP/x11-smoke.log"
      - name: Exercise real wallpaper apply and undo on a private Xvfb
        run: APPIMAGE_EXTRACT_AND_RUN=1 dist/DesktopTheming-x86_64.AppImage --smoke-test-wallpaper
      - name: Exercise bundled QML and engine in temporary HOME/XDG
        run: |
          APPIMAGE_EXTRACT_AND_RUN=1 dist/DesktopTheming-x86_64.AppImage --smoke-test
          cd dist
          sha256sum DesktopTheming-x86_64.AppImage > DesktopTheming-x86_64.AppImage.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: DesktopTheming-x86_64
          path: |
            dist/DesktopTheming-x86_64.AppImage
            dist/DesktopTheming-x86_64.AppImage.sha256

  release:
    if: github.event_name == 'workflow_dispatch'
    needs: appimage
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.appimage.outputs.source_sha }}
      - uses: actions/download-artifact@v4
        with:
          name: DesktopTheming-x86_64
          path: dist
      - name: Verify and publish the tested AppImage
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ needs.appimage.outputs.source_sha }}
        run: |
          cd dist
          sha256sum --check DesktopTheming-x86_64.AppImage.sha256
          [[ "$(git ls-remote origin refs/heads/main | cut -f1)" == "$SOURCE_SHA" ]] || { echo 'main advanced during build; dispatch again'; exit 1; }
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          Desktop Theming $RELEASE_VERSION, built and smoke-tested from main at $SOURCE_SHA.

          Download DesktopTheming-x86_64.AppImage and make it executable to launch.
          Target: x86_64 Linux, glibc 2.35+ (Ubuntu 22.04 build base).
          FUSE is required for normal mounting; APPIMAGE_EXTRACT_AND_RUN=1 is the fallback.
          The accompanying .sha256 file verifies the download.

          Managed integrations now cover Alacritty, foot, i3, Sway, Hyprland,
          KDE application colors, Polybar, Waybar, Rofi, Wofi, Dunst, Mako,
          GTK 3, GTK 4, qt5ct/qt6ct, zsh and fish, alongside Kitty and Ghostty.
          Native GNOME mode/accent and Xfce installed light/dark counterparts
          use reviewed preferences with rollback, disconnect and undo.
          Swaybg has a Sway background configuration workflow for the next
          manual reload, without replacing a running process.

          Graphics startup uses the host C++ runtime, fixing the Mesa/GLX failure
          caused by the older runtime bundled in 0.1.0. Qt X11 dependencies are
          included; both X11/OpenGL and offscreen diagnostics run before publication.

          Host wallpaper tools use their own libraries instead of inheriting bundle
          OpenSSL/Qt paths. This fixes feh failures when applying wallpaper on newer
          systems. Real feh apply, undo and failure rollback are tested on a private Xvfb.

          Existing preferences are preserved within each adapter's documented
          scope. Exact changes require review; later edits block overwrites.
          Nothing installs packages, signals applications or invokes legacy hooks.
          The bundled diagnostic exercises all eighteen new file adapters.
          See docs/INTEGRATIONS.md, docs/APPIMAGE.md and docs/WALLPAPER.md for
          capability, native syntax, activation and validation limits. Native
          preference tests simulate protocols; every real desktop is not verified.
          EOF
          gh release create "v$RELEASE_VERSION" \
            --target "$SOURCE_SHA" --title "Desktop Theming $RELEASE_VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md" --generate-notes --latest \
            DesktopTheming-x86_64.AppImage DesktopTheming-x86_64.AppImage.sha256
