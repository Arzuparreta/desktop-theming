;==========================================================
; Polybar — pywal-driven, minimal / programmer-friendly
;==========================================================

[colors]
background     = ${xrdb:color0:#282828}
foreground     = ${xrdb:color7:#ebdbb2}
foreground-alt = ${xrdb:color7:#d5c4a1}
muted          = ${xrdb:color8:#665c54}
dim            = ${xrdb:color8:#928374}
primary        = ${xrdb:color4:#458588}
accent         = ${xrdb:color6:#689d6a}
warning        = ${xrdb:color3:#d79921}
critical       = ${xrdb:color1:#cc241d}
surface        = ${xrdb:color0:#282828}

[bar/example]
monitor = ${env:MONITOR:}
width = 100%
height = 34
radius = 0.0
fixed-center = true
top = yes
bottom = no
override-redirect = false

foreground = ${colors.foreground-alt}
background = ${colors.surface}

line-size = 0
border-bottom-size = 1
border-color = ${colors.muted}

padding-left = 0
padding-right = 0
padding-top = 4
padding-bottom = 4

module-margin-left = 0
module-margin-right = 0

; T1 = SemiBold — workspace index, time, battery %, etc.
font-0 = "JetBrainsMonoNL Nerd Font:style=SemiBold:pixelsize=16;3"
font-1 = "JetBrainsMonoNL Nerd Font:style=Regular:pixelsize=16;3"

modules-left = i3 sp dictation
modules-center = title
modules-right = memory sep fs_root sep battery0 sep battery1 sep system-power sep cpu-temp sep caffeine clock

wm-restack = i3
cursor-click = pointer

scroll-up = #i3.next
scroll-down = #i3.prev

[module/sep]
type = custom/text
format = ·
format-foreground = ${colors.muted}
format-padding = 1
format-font = 1

[module/i3]
type = internal/i3
format = <label-state> <label-mode>
format-margin = 0
index-sort = true
wrapping-scroll = false
strip-wsnumbers = false
enable-click = false
enable-scroll = false
pin-workspaces = true

label-mode = %{T1}%mode%%{T-}
label-mode-padding = 1
label-mode-foreground = ${colors.warning}
label-mode-background = ${colors.surface}

label-focused = %{T1}%index%%{T-}
label-focused-padding = 2
label-focused-foreground = ${colors.background}
label-focused-background = ${colors.primary}

label-unfocused = %{T1}%index%%{T-}
label-unfocused-padding = 2
label-unfocused-foreground = ${colors.dim}
label-unfocused-background = ${colors.surface}

label-visible = %{T1}%index%%{T-}
label-visible-padding = 2
label-visible-foreground = ${colors.primary}
label-visible-background = ${colors.surface}

label-urgent = %{T1}%index%%{T-}
label-urgent-padding = 2
label-urgent-foreground = ${colors.background}
label-urgent-background = ${colors.critical}

label-separator = " "
label-separator-padding = 0
label-separator-foreground = ${colors.muted}

[module/title]
type = internal/xwindow
format = <label>
format-foreground = ${colors.dim}
format-font = 1
label = %{T1}%instance%%{T-}
label-maxlen = 55
label-empty = —
label-empty-foreground = ${colors.muted}

[module/memory]
type = internal/memory
interval = 2
warn-percentage = 92

format = <label>
format-prefix = "ram "
format-prefix-foreground = ${colors.dim}
format-prefix-font = 1
label = %percentage_used%% (%gb_used%/%gb_total%)
label-foreground = ${colors.foreground}
label-font = 1

[module/fs_root]
type = internal/fs
mount-0 = /
interval = 30
spacing = 0
fixed-values = true

warn-percentage = 90
format-mounted = <label-mounted>
format-warn = <label-warn>
format-unmounted = <label-unmounted>

format-mounted-prefix = "ssd "
format-mounted-prefix-foreground = ${colors.dim}
format-mounted-prefix-font = 1
label-mounted = %free% · %percentage_used%%
label-mounted-foreground = ${colors.foreground}
label-mounted-font = 1

format-warn-prefix = "ssd "
format-warn-prefix-foreground = ${colors.critical}
format-warn-prefix-font = 1
label-warn = %free% · %percentage_used%%
label-warn-foreground = ${colors.critical}
label-warn-font = 1

format-unmounted-prefix = "ssd "
format-unmounted-prefix-foreground = ${colors.warning}
format-unmounted-prefix-font = 1
label-unmounted = not mounted
label-unmounted-foreground = ${colors.warning}
label-unmounted-font = 1

[module/battery0]
type = internal/battery
battery = BAT0
adapter = AC
full-at = 98
poll-interval = 5

format-charging = <label-charging>
format-discharging = <label-discharging>
format-full = <label-full>

format-charging-prefix = "bat0 "
format-charging-prefix-foreground = ${colors.dim}
format-charging-prefix-font = 1
label-charging = %{T1}%percentage%%%{T-} +
label-charging-foreground = ${colors.accent}
label-charging-font = 1

format-discharging-prefix = "bat0 "
format-discharging-prefix-foreground = ${colors.dim}
format-discharging-prefix-font = 1
label-discharging = %{T1}%percentage%%%{T-}
label-discharging-foreground = ${colors.foreground}
label-discharging-font = 1

format-full-prefix = "bat0 "
format-full-prefix-foreground = ${colors.dim}
format-full-prefix-font = 1
label-full = full
label-full-foreground = ${colors.muted}
label-full-font = 1

[module/battery1]
type = internal/battery
battery = BAT1
adapter = AC
full-at = 98
poll-interval = 5

format-charging = <label-charging>
format-discharging = <label-discharging>
format-full = <label-full>

format-charging-prefix = "bat1 "
format-charging-prefix-foreground = ${colors.dim}
format-charging-prefix-font = 1
label-charging = %{T1}%percentage%%%{T-} +
label-charging-foreground = ${colors.accent}
label-charging-font = 1

format-discharging-prefix = "bat1 "
format-discharging-prefix-foreground = ${colors.dim}
format-discharging-prefix-font = 1
label-discharging = %{T1}%percentage%%%{T-}
label-discharging-foreground = ${colors.foreground}
label-discharging-font = 1

format-full-prefix = "bat1 "
format-full-prefix-foreground = ${colors.dim}
format-full-prefix-font = 1
label-full = full
label-full-foreground = ${colors.muted}
label-full-font = 1

[module/system-power]
type = custom/script
exec = ~/.config/polybar/scripts/system-power.sh
interval = 2
format = <label>
format-prefix = "pwr "
format-prefix-foreground = ${colors.dim}
format-prefix-font = 1
label = %output%
label-foreground = ${colors.foreground}
label-font = 1

[module/clock]
type = internal/date
interval = 1
time = %H:%M

format = <label>
format-margin = 0
label = %{T1}%time%%{T-}
label-foreground = ${colors.foreground-alt}
label-font = 1

[module/volume]
type = internal/alsa
master-soundcard = default
speaker-soundcard = default
headphone-soundcard = default
master-mixer = Master

format-volume = "<label-volume><bar-volume>"
label-volume = "vol "
label-volume-foreground = ${colors.foreground-alt}
label-volume-background = ${colors.surface}

format-muted-prefix = "vol "
format-muted-foreground = ${colors.muted}
format-muted-background = ${colors.surface}
label-muted = mute

bar-volume-width = 6
bar-volume-foreground-0 = ${colors.primary}
bar-volume-foreground-1 = ${colors.primary}
bar-volume-foreground-2 = ${colors.primary}
bar-volume-foreground-3 = ${colors.warning}
bar-volume-foreground-4 = ${colors.critical}
bar-volume-foreground-5 = ${colors.critical}
bar-volume-foreground-6 = ${colors.critical}
bar-volume-gradient = false
bar-volume-indicator = │
bar-volume-indicator-font = 1
bar-volume-indicator-foreground = ${colors.foreground}
bar-volume-fill = ─
bar-volume-fill-font = 1
bar-volume-fill-foreground = ${colors.primary}
bar-volume-empty = ─
bar-volume-empty-font = 1
bar-volume-empty-foreground = ${colors.muted}

[settings]
screenchange-reload = true
compositing-background = over
compositing-foreground = over
compositing-overline = over
compositing-border = over

[global/wm]
margin-top = 0
margin-bottom = 0

[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock
blacklist-1 = scroll lock

format = <label-layout><label-indicator>
format-prefix = ""
format-prefix-font = 4
format-prefix-foreground = ${colors.foreground-alt}
format-prefix-background = ${colors.surface}
format-foreground = ${colors.foreground-alt}
format-background = ${colors.surface}

label-indicator-on = CAPS
label-indicator-on-foreground = ${colors.warning}
label-indicator-on-background = ${colors.surface}
label-indicator-on-padding = 1

[module/cpu-temp]
type = custom/script
exec = ~/.scripts/cpu-temp.sh
interval = 2

[module/dictation]
type = custom/script
exec = cat /tmp/dictate_status 2>/dev/null || echo ""
interval = 0.5
label = %output%

[module/caffeine]
type = custom/script
exec = ~/.local/bin/polybar_caffeine.sh
interval = 2
click-left = ~/.local/bin/polybar_caffeine.sh toggle
format = <label>
format-padding = 1
label = %output%
